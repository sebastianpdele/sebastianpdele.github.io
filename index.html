<!DOCTYPE html>

<head>

  <title>Sebastian P.</title>
  <meta name="description" content="Sound design and audio programming portfolio." />
  <style>
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 8px;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    main {
      max-width: 64ch;
    }

    .header-photo img {
      width: 195px;
      max-width: 100%;
      height: auto;
      display: block;
    }

    video {
      width: 100%;
      max-width: 420px;
      height: auto;
      display: block;
    }

    audio {
      width: 100%;
      max-width: 420px;
    }

    details {
      margin: 0 0 1em;
    }

    summary {
      cursor: pointer;
    }

    .track {
      margin-bottom: 0.75em;
    }

    :focus-visible {
      outline: 2px solid Highlight;
      outline-offset: 2px;
    }
    h1 {
      font-size: 1.4rem;   
    }
  </style>
</head>

    <header>

      <div class="header-photo">
